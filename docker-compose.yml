services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://farmguard:${POSTGRES_PASSWORD}@db:5432/farmguard
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=farmguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=farmguard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
